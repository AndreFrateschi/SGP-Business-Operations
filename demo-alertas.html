<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGP · Demonstração dos alertas</title><link rel="stylesheet" href="css/styles.css"><body><main style="margin:0;max-width:1000px;margin-inline:auto"><h1>SGP · Alertas de execução</h1><p>Simulação com dados fictícios. Nenhum dado dos seus projetos será alterado.</p><div class="actions"><a href="./">Voltar à aplicação</a><button id="theme">Alternar claro / escuro</button></div><section class="panel settings" style="margin-top:20px"><h2>Experimente os cenários</h2><div class="actions"><button data-case="desvio">80h e 30% concluído</button><button data-case="excesso">120h de 100h</button><button data-case="fase">Fase vencida</button><button data-case="normal">Sem desvio</button></div><div class="form-grid"><label class="field">Horas estimadas<input id="estimated" type="number" min="1" value="100"></label><label class="field">Horas consumidas<input id="consumed" type="number" min="0" value="80"></label><label class="field">Conclusão (%)<input id="progress" type="number" min="0" max="100" value="30"></label></div><label><input id="late" type="checkbox"> Fase Desenvolvimento vencida ontem, ainda em andamento</label></section><div id="result"></div><dialog id="detail"><div class="modal-body"><h2>DEMO-001 · Projeto de exemplo</h2><p id="numbers"></p><button onclick="document.getElementById('detail').close()">Fechar</button></div></dialog></main><script src="js/utils.js"></script><script src="js/dashboard.js?v=execution-demo-1"></script><script>
const get=id=>document.getElementById(id);
function render(){const d={id:'demo',code:'DEMO-001',name:'Projeto de exemplo',status:'Em andamento',estimated:Number(get('estimated').value),consumed:Number(get('consumed').value),progress:Number(get('progress').value)};const data={fases:get('late').checked?[{demand:'demo',phase:'Desenvolvimento',end:SGP.add(SGP.today(),-1),status:'Em andamento'}]:[]};const risks=SGP.executionRisks(data,[d]);get('result').innerHTML=SGP.executionPanel(risks)||'<section class="panel settings"><h2>✓ Nenhum alerta de execução neste cenário</h2><p>Os valores informados não atingem os limites dos alertas.</p></section>';get('numbers').textContent=`${d.consumed}h consumidas / ${d.estimated}h estimadas · ${d.progress}% concluído`;get('result').querySelectorAll('button').forEach(b=>b.onclick=()=>get('detail').showModal());}
document.querySelectorAll('input').forEach(i=>i.oninput=render);document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{const c=b.dataset.case;get('estimated').value=100;get('consumed').value=c==='excesso'?120:c==='desvio'?80:40;get('progress').value=c==='desvio'?30:50;get('late').checked=c==='fase';render()});get('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';render();
</script></body></html>
